name: PR Docker Publish

# Fork-only branch image builds for testing. Unlike docker-publish.yml this is
# not a release workflow: no cosign signing, and the image tag is the branch
# name (slashes replaced with '-'), e.g. ghcr.io/kjvalencik/etcd-operator:kj-foo.
#
# pull_request workflows run from the PR merge commit, which includes base-
# branch files — so this file only needs to exist on fork main. Open a PR from
# a branch to fork main and every push to it rebuilds the image, even though
# the branch itself never carries this workflow (keeping upstream PRs clean).
#
# Note: GITHUB_TOKEN gets packages:write only for same-repo PR heads; PRs from
# other forks would fail to push.

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-docker-publish-${{ github.head_ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # Never publish branch images from the upstream repo if this file ever
    # lands there.
    if: github.repository_owner == 'kjvalencik'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Build the branch exactly as PR'd upstream, not the merge commit
          # with fork-main-only changes folded in.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute image tag from branch name
        id: branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: echo "tag=${BRANCH//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.3.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.branch.outputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
